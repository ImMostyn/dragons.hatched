<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183c32">
  <title>Dragons Hatched</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --forest: #183c32;
      --forest-2: #244e40;
      --leaf: #dcedc5;
      --leaf-light: #f0f5dd;
      --paper: #fbf8eb;
      --muted: #788776;
      --line: #e4e6d5;
      --orange: #e88750;
      --gold: #efbd5b;
      --white: #fffef8;
      --shadow: 0 15px 50px rgba(27, 55, 42, .12);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--paper); color: var(--forest); font-family: "Nunito", sans-serif; }
    button, select { font: inherit; }
    button { color: inherit; }
    #app { height: 100%; display: grid; grid-template-rows: 68px minmax(0, 1fr); }
    .topbar {
      position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between;
      gap: 20px; padding: 0 26px; background: var(--forest); color: var(--white);
      box-shadow: 0 4px 18px rgba(19, 50, 39, .13);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 220px; }
    .brand-mark { width: 37px; height: 37px; display: grid; place-items: center; border: 1px solid #90b18b; border-radius: 12px 12px 12px 4px; color: #d8efa9; font-size: 19px; transform: rotate(-5deg); }
    .brand-name { font-size: 15px; font-weight: 900; line-height: 1; letter-spacing: .07em; }
    .brand-tag { margin-top: 5px; color: #b7cfb1; font: 9px "DM Mono", monospace; letter-spacing: .12em; }
    .tag-small { display: none; }
    .nav { display: flex; align-items: stretch; height: 100%; gap: 5px; }
    .nav-button { position: relative; padding: 0 14px; border: 0; background: none; color: #c1d3c3; font-size: 12px; font-weight: 800; cursor: pointer; transition: color .18s; }
    .nav-button:hover, .nav-button.active { color: #f5f2d9; }
    .nav-button.active::after { position: absolute; content: ""; bottom: 0; left: 13px; right: 13px; height: 3px; border-radius: 3px 3px 0 0; background: #d7eba6; }
    .wallet { display: flex; align-items: center; gap: 8px; min-width: 220px; justify-content: flex-end; color: #f6d47f; font: 12px "DM Mono", monospace; }
    .bag-count { display: flex; align-items: center; gap: 7px; margin-left: 9px; padding: 7px 10px; border: 1px solid rgba(236, 244, 224, .2); border-radius: 7px; color: #edf4df; }
    .bag-icon { color: #d7eba6; }
    main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 388px; }
    .world { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #d2e7cb; }
    #scene { position: absolute; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .scene-vignette { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg,rgba(248,250,231,.2),transparent 25%,transparent 72%,rgba(33,73,53,.13)); }
    .scene-label { position: absolute; top: 24px; left: 25px; padding-left: 12px; border-left: 2px solid #698c62; pointer-events: none; }
    .scene-label strong { display: block; font-size: 13px; font-weight: 900; letter-spacing: .03em; }
    .scene-label span { display: block; margin-top: 3px; color: #547057; font: 9px "DM Mono",monospace; letter-spacing: .11em; }
    .scene-tip { position: absolute; left: 25px; bottom: 20px; color: #47634d; font-size: 11px; font-weight: 700; pointer-events: none; }
    .scene-tip .spark { color: #bd7936; padding-right: 5px; }
    .view-tag { position: absolute; top: 20px; right: 21px; padding: 7px 10px; border: 1px solid rgba(65,102,71,.2); border-radius: 5px; color: #466548; background: rgba(247,249,230,.65); font: 9px "DM Mono",monospace; letter-spacing: .08em; }
    .panel { position: relative; z-index: 1; overflow-y: auto; padding: 22px 22px 30px; background: var(--paper); border-left: 1px solid #e7e8d8; }
    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-thumb { background: #ced9c2; border-radius: 9px; }
    .panel-kicker { color: #71866b; font: 9px "DM Mono",monospace; letter-spacing: .14em; }
    .panel h1 { margin: 6px 0 5px; font-size: 22px; line-height: 1.15; font-weight: 900; }
    .panel-intro { margin: 0; color: #788776; font-size: 12px; line-height: 1.55; }
    .rule { height: 1px; margin: 17px 0; background: var(--line); }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .section-heading h2 { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: .03em; }
    .section-note { color: var(--muted); font: 9px "DM Mono",monospace; }
    .egg-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
    .egg-choice { min-width: 0; display: flex; align-items: center; gap: 7px; padding: 8px 7px; border: 1px solid var(--line); border-radius: 7px; background: #fffef8; text-align: left; cursor: pointer; transition: border .16s,background .16s,transform .16s; }
    .egg-choice:hover { transform: translateY(-1px); border-color: #9cb48c; }
    .egg-choice.selected { border-color: #527d57; background: #eaf1d9; box-shadow: inset 0 0 0 1px #527d57; }
    .egg-swatch { flex: 0 0 20px; width: 20px; height: 24px; border-radius: 55% 55% 48% 48% / 44% 44% 56% 56%; background: var(--egg-color); box-shadow: inset -4px -3px 0 rgba(34,48,38,.14), inset 3px 2px 0 rgba(255,255,255,.55); }
    .egg-choice-name { overflow: hidden; text-overflow: ellipsis; font-size: 10px; font-weight: 900; }
    .egg-choice-cost { display: block; margin-top: 2px; color: #798879; font: 8px "DM Mono",monospace; }
    .primary, .secondary, .quiet-button { min-height: 39px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border-radius: 6px; font-size: 11px; font-weight: 900; cursor: pointer; transition: transform .16s,background .16s,border .16s; }
    .primary { border: 1px solid var(--forest); background: var(--forest); color: white; }
    .primary:hover:not(:disabled) { transform: translateY(-1px); background: #2a5b47; }
    .secondary { border: 1px solid #cbd7bf; background: #edf2df; color: var(--forest); }
    .secondary:hover:not(:disabled) { background: #e1ebcd; }
    .quiet-button { min-height: 30px; padding: 0 9px; border: 1px solid var(--line); background: transparent; color: #506750; font-size: 10px; }
    button:disabled { opacity: .43; cursor: not-allowed; }
    .full { width: 100%; }
    .button-row { display: flex; gap: 8px; }
    .button-row > * { flex: 1; }
    .selection-detail { min-height: 35px; margin: 9px 0 11px; color: #71806f; font-size: 10px; line-height: 1.5; }
    .notice { margin: 11px 0 0; padding: 9px 10px; border-radius: 5px; background: #f0f0dd; color: #657260; font-size: 10px; line-height: 1.45; }
    .slots { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; }
    .slot { min-width: 0; height: 47px; display: flex; align-items: center; justify-content: center; border: 1px dashed #d2d9c7; border-radius: 6px; background: rgba(255,255,250,.72); color: #83917e; font-size: 10px; }
    .slot.filled { border-style: solid; border-color: #d8dfce; background: #f3f4e7; color: #415e46; font-size: 9px; font-weight: 800; text-align: center; line-height: 1.15; overflow-wrap: anywhere; padding: 3px; }
    .dragon-card { padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fffef8; }
    .dragon-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .dragon-name { font-size: 14px; font-weight: 900; }
    .stage-pill { padding: 4px 7px; border-radius: 20px; background: #e6eed5; color: #4a714d; font: 9px "DM Mono",monospace; }
    .parent-line { margin-top: 2px; color: #82907d; font-size: 10px; }
    .meter-row { display: grid; grid-template-columns: 58px 1fr 25px; gap: 7px; align-items: center; margin-top: 10px; color: #657360; font-size: 9px; }
    .meter { height: 5px; overflow: hidden; border-radius: 6px; background: #e9ebdc; }
    .meter-fill { width: 0; height: 100%; border-radius: inherit; background: #8dbb75; transition: width .2s; }
    .meter-fill.joy { background: #e9ad63; }
    .meter-fill.energy { background: #81b9b7; }
    .meter-value { text-align: right; color: #788776; font: 8px "DM Mono",monospace; }
    .action-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; }
    .care-action { min-height: 55px; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid #e2e5d5; border-radius: 7px; background: #fffef8; text-align: left; cursor: pointer; }
    .care-action:hover:not(:disabled) { border-color: #aec19d; background: #f4f5e8; }
    .care-icon { width: 26px; height: 26px; flex: 0 0 26px; display: grid; place-items: center; border-radius: 8px; background: #e9efd9; color: #587b55; font-size: 13px; }
    .care-action strong { display: block; font-size: 10px; font-weight: 900; }
    .care-action small { display: block; margin-top: 2px; color: #81907c; font-size: 8px; }
    .dragon-select, .select { width: 100%; height: 38px; margin: 9px 0; padding: 0 9px; border: 1px solid #dfe3d3; border-radius: 6px; background: #fffef8; color: #294b39; font-size: 11px; }
    .shop-list { display: grid; gap: 7px; }
    .shop-item { display: grid; grid-template-columns: 31px 1fr auto; align-items: center; gap: 9px; padding: 9px; border: 1px solid var(--line); border-radius: 7px; background: #fffef8; }
    .shop-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: #eef0dd; font-size: 16px; }
    .shop-name { font-size: 10px; font-weight: 900; }
    .shop-desc { margin-top: 2px; color: #81907c; font-size: 9px; }
    .shop-buy { padding: 6px 8px; border: 1px solid #d6deca; border-radius: 5px; background: #edf2df; color: #335340; font: 9px "DM Mono",monospace; cursor: pointer; }
    .shop-buy:hover:not(:disabled) { background: #e0eacd; }
    .empty-state { padding: 17px 12px; border: 1px dashed #d5dccb; border-radius: 7px; color: #788776; text-align: center; font-size: 11px; line-height: 1.5; }
    .inventory-label { margin-bottom: 8px; }
    .toast { position: fixed; z-index: 8; left: 50%; bottom: 22px; transform: translate(-50%,8px); padding: 9px 14px; border-radius: 20px; background: #244e40; color: #fffde8; box-shadow: var(--shadow); font-size: 11px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s,transform .2s; }
    .toast.show { transform: translate(-50%,0); opacity: 1; }
    @media (max-width: 920px) {
      main { grid-template-columns: minmax(0,1fr) 350px; }
      .topbar { padding: 0 17px; gap: 10px; }
      .brand,.wallet { min-width: 175px; }
      .nav-button { padding: 0 9px; }
    }
    @media (max-width: 700px) {
      html,body { height: 100%; overflow: hidden; }
      #app { grid-template-rows: 59px minmax(0,1fr); }
      .topbar { padding: 0 11px; gap: 4px; }
      .brand { min-width: unset; gap: 7px; }
      .brand-mark { width: 32px; height: 32px; font-size: 16px; }
      .brand-name { font-size: 11px; }
      .brand-tag { font-size: 7px; }
      .wallet { min-width: unset; font-size: 10px; gap: 4px; }
      .bag-count { margin-left: 2px; padding: 5px 6px; font-size: 9px; }
      main { display: flex; flex-direction: column; }
      .world { flex: 0 0 37%; min-height: 185px; }
      .scene-label { top: 12px; left: 13px; }
      .scene-label strong { font-size: 11px; }
      .scene-label span { font-size: 8px; }
      .scene-tip { left: 13px; bottom: 10px; font-size: 9px; }
      .view-tag { top: 11px; right: 11px; font-size: 8px; }
      .panel { flex: 1; padding: 15px 15px 28px; border-left: 0; border-top: 1px solid #e7e8d8; }
      .panel h1 { font-size: 19px; }
      .rule { margin: 12px 0; }
      .egg-grid { gap: 6px; }
      .egg-choice { padding: 6px; gap: 5px; }
      .egg-choice-name { font-size: 9px; }
      .egg-swatch { flex-basis: 18px; width: 18px; height: 22px; }
    }
    @media (max-width: 400px) {
      .brand { gap: 5px; }
      .brand-mark { width: 29px; height: 29px; }
      .brand-name { font-size: 9px; white-space: nowrap; }
      .brand-tag { display: block; font-size: 7px; letter-spacing: .04em; }
      .tag-wide { display: none; }
      .tag-small { display: inline; }
      .nav { gap: 0; }
      .nav-button { padding: 0 4px; font-size: 9px; white-space: nowrap; }
      .wallet { gap: 3px; font-size: 9px; }
      .wallet .coin-label { display: none; }
      .bag-count { gap: 4px; margin-left: 1px; padding: 4px 5px; white-space: nowrap; }
      .egg-choice { gap: 4px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">&#10022;</div><div><div class="brand-name">DRAGONS HATCHED</div><div class="brand-tag"><span class="tag-wide">AGES 5+ · A LITTLE WORLD OF YOUR OWN</span><span class="tag-small">AGES 5+</span></div></div></div>
      <nav class="nav" aria-label="Game areas">
        <button class="nav-button active" data-view="home">Hatchery</button>
        <button class="nav-button" data-view="store">Store</button>
        <button class="nav-button" data-view="pair">Pairing</button>
        <button class="nav-button" data-view="alchemy">Alchemy</button>
      </nav>
      <div class="wallet"><span aria-hidden="true">&#9672;</span><span class="coin-label">SUN COINS</span><strong id="coins">8</strong><span class="bag-count"><span class="bag-icon">&#9634;</span><span id="bag-count">0/5</span></span></div>
    </header>
    <main>
      <section class="world" aria-label="Three-dimensional dragon habitat">
        <div id="scene"></div><div class="scene-vignette"></div>
        <div class="scene-label"><strong id="scene-title">The Fernlight Hatchery</strong><span id="scene-subtitle">A SAFE PLACE TO BEGIN</span></div>
        <div class="view-tag" id="view-tag">YOUR FIRST EGG</div>
        <div class="scene-tip" id="scene-tip"><span class="spark">&#10022;</span>Pick an egg to begin your story</div>
      </section>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const TYPES = {
      Fire:      { color:'#ef7049', accent:'#ffd378', skill:'Warmth', desc:'A bright-hearted dragon with a little flame to share.' },
      Water:     { color:'#56a9c5', accent:'#b3eaf0', skill:'Splash', desc:'A gentle swimmer who can send water tumbling.' },
      Earth:     { color:'#92764f', accent:'#d6c28a', skill:'Stone', desc:'A sturdy friend who can shift rocks out of the way.' },
      Air:       { color:'#a4c9d2', accent:'#e5f4dd', skill:'Gust', desc:'A breezy flier who can sweep leaves aside.' },
      Lightning: { color:'#d9b945', accent:'#fff0a0', skill:'Spark', desc:'A quick little dragon with a crackly surprise.' },
      Lava:      { color:'#b95040', accent:'#f6a14c', skill:'Melt', desc:'A brave dragon with a warm, glowing core.' },
      Forest:    { color:'#588b55', accent:'#b7d879', skill:'Bloom', desc:'A leafy friend who helps new things grow.' },
      Amethyst:  { color:'#9279bd', accent:'#dbc4f4', skill:'Shimmer', desc:'A thoughtful dragon with a twinkly crystal glow.' },
      Diamond:   { color:'#70b8b2', accent:'#d4f7ed', skill:'Prism', desc:'A sparkling dragon who sends rainbows dancing.' }
    };
    const TYPES_LIST = Object.keys(TYPES);
    const STAGES = [
      { name:'Baby', min:0, scale:.69 }, { name:'Child', min:4, scale:.82 },
      { name:'Teenager', min:10, scale:1 }, { name:'Adult', min:18, scale:1.16 }, { name:'Elder', min:28, scale:1.28 }
    ];
    const newState = () => ({ coins:8, inventory:[], drawer:[], drawerOpen:false, ovenOpen:true, dragons:[], selectedDragon:null, selectedEgg:null, firstPick:true, incubator:null, lastCare:Date.now(), nextId:1 });
    let state;
    try { state = { ...newState(), ...JSON.parse(localStorage.getItem('dragonsHatchedSave') || '{}') }; }
    catch { state = newState(); }
    state.inventory ||= []; state.drawer ||= []; state.dragons ||= [];
    if (state.ovenOpen === undefined) state.ovenOpen = true;
    const remainingItems = [];
    state.inventory.forEach(item=>{
      if(item.kind==='egg'&&state.drawer.length<5)state.drawer.push(item);
      else remainingItems.push(item);
    });
    state.inventory=remainingItems;
    const save = () => localStorage.setItem('dragonsHatchedSave', JSON.stringify(state));
    const $ = selector => document.querySelector(selector);
    const panel = $('#panel');
    const sceneHost = $('#scene');
    let currentView = 'home';
    let toastTimer;

    function say(message) {
      const toast = $('#toast'); toast.textContent = message; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
    }
    function stageOf(dragon) {
      return [...STAGES].reverse().find(stage => dragon.xp >= stage.min) || STAGES[0];
    }
    function selectedDragon() { return state.dragons.find(dragon => dragon.id === state.selectedDragon) || state.dragons[0] || null; }
    function inventoryCount() { return state.inventory.length; }
    function addItem(item) {
      if (inventoryCount() >= 5) { say('Your bag is full. Use an item first.'); return false; }
      state.inventory.push(item); save(); return true;
    }
    function typeLabel(type) { return type.split('+').join(' + '); }
    function dragonName(dragon) { return dragon.name || `${dragon.type}ling`; }
    function hasAdult() { return state.dragons.some(dragon => stageOf(dragon).name === 'Adult' || stageOf(dragon).name === 'Elder'); }
    function renderHeader() {
      $('#coins').textContent = state.coins;
      $('#bag-count').textContent = `${inventoryCount()}/5`;
      document.querySelectorAll('.nav-button').forEach(button => button.classList.toggle('active', button.dataset.view === currentView));
    }
    function eggColor(type) {
      const colors = type.split('+').map(part => TYPES[part]?.color).filter(Boolean);
      return colors.length > 1 ? `linear-gradient(115deg,${colors.join(',')})` : colors[0] || '#d6a75b';
    }
    function inventoryMarkup() {
      const slots = Array.from({length:5}, (_,index) => state.inventory[index]
        ? `<div class="slot filled" title="${escapeHtml(itemName(state.inventory[index]))}">${escapeHtml(itemName(state.inventory[index]))}</div>`
        : '<div class="slot" aria-label="Empty inventory slot">&#183;</div>').join('');
      return `<div class="section-heading inventory-label"><h2>YOUR BAG</h2><span class="section-note">${inventoryCount()} OF 5 SLOTS</span></div><div class="slots">${slots}</div>`;
    }
    function itemName(item) {
      if (item.kind === 'egg') return `${typeLabel(item.type)} egg`;
      if (item.kind === 'treat') return 'Treat';
      return 'Item';
    }
    function readyEggsMarkup() {
      const eggs = state.inventory.map((item,index)=>({item,index})).filter(entry=>entry.item.kind==='egg');
      if (!eggs.length) return '';
      return `<div class="section-heading" style="margin-top:15px"><h2>EGGS IN YOUR BAG</h2><span class="section-note">STORE OR LOAD</span></div>
        <div class="shop-list">${eggs.map(({item,index})=>`<div class="shop-item"><span class="egg-swatch" style="--egg-color:${eggColor(item.type)};margin:auto"></span><div><div class="shop-name">${escapeHtml(typeLabel(item.type))} egg</div><div class="shop-desc">${item.type.includes('+')?'Multi-egg':'Classic egg'}</div></div><button class="shop-buy" data-store-egg="${index}" ${state.drawer.length>=5?'disabled':''}>Store</button><button class="shop-buy" data-incubate="${index}" ${state.incubator||!state.ovenOpen?'disabled':''}>Load</button></div>`).join('')}</div>`;
    }
    function drawerMarkup() {
      return `<div class="section-heading" style="margin-top:15px"><h2>EGG DRAWER</h2><button class="quiet-button" id="toggle-drawer">${state.drawerOpen?'Close drawer':'Open drawer'}</button></div>
        <p class="section-note" style="display:block;margin-bottom:8px">GENTLE STORAGE · ${state.drawer.length}/5 EGGS</p>
        ${state.drawer.length?`<div class="shop-list">${state.drawer.map((egg,index)=>`<div class="shop-item"><span class="egg-swatch" style="--egg-color:${eggColor(egg.type)};margin:auto"></span><div><div class="shop-name">${escapeHtml(typeLabel(egg.type))} egg</div><div class="shop-desc">Resting safely in the rack</div></div><button class="shop-buy" data-load-drawer="${index}" ${state.incubator||!state.ovenOpen?'disabled':''}>Load oven</button></div>`).join('')}</div>`:'<div class="empty-state">The rack is empty. Store an egg here to keep it safe and cool.</div>'}`;
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    function eggPicker() {
      const canChooseFree = state.firstPick && state.dragons.length === 0 && !state.incubator;
      return `<div class="section-heading"><h2>CHOOSE AN EGG</h2><span class="section-note">${canChooseFree ? 'YOUR FIRST IS A GIFT' : 'CLASSIC EGGS'}</span></div>
        <div class="egg-grid">${TYPES_LIST.map(type => `<button class="egg-choice ${state.selectedEgg === type ? 'selected':''}" data-egg="${type}" aria-pressed="${state.selectedEgg === type}" style="--egg-color:${TYPES[type].color}"><span class="egg-swatch"></span><span><span class="egg-choice-name">${type}</span><span class="egg-choice-cost">${canChooseFree ? 'FREE' : '4 COINS'}</span></span></button>`).join('')}</div>
        <p class="selection-detail">${state.selectedEgg ? TYPES[state.selectedEgg].desc : 'Every egg has its own look and a special skill.'}</p>
        <button class="primary full" id="choose-egg" ${state.selectedEgg ? '' : 'disabled'}>${canChooseFree ? 'Choose this egg' : 'Buy this egg · 4 coins'}</button>`;
    }
    function meter(label, value, kind) {
